<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="TankCopilot - Tankbuch & Verbrauchsplaner für Autofahrer">
  <meta name="theme-color" content="#00A8A8">
  
  <!-- iOS PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TankCopilot">
  
  <!-- Permissions Policy - Erlaube Geolocation explizit -->
  <meta http-equiv="Permissions-Policy" content="geolocation=(self)">
  
  <!-- Manifest & Icons -->
  <link rel="manifest" href="/TankCopilot/app/manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="/TankCopilot/app/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="/TankCopilot/app/icons/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/TankCopilot/app/icons/icon-512x512.png">
  
  <!-- Apple Touch Icons für iOS -->
  <link rel="apple-touch-icon" href="/TankCopilot/app/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/TankCopilot/app/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/TankCopilot/app/icons/icon-512x512.png">
  
  <title>TankCopilot</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
